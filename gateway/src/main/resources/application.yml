server:
  port: 8080

jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: ${AUTH_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/auth/**

        - id: matching-service-jobs
          uri: ${MATCHING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/jobs/**

        - id: matching-service-resumes
          uri: ${MATCHING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/resumes/**

        - id: matching-service-matches
          uri: ${MATCHING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/matches/**

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route.RouteDefinitionRouteLocator: DEBUG
















